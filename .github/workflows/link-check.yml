name: Link Checker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly check on Sundays at midnight UTC

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install lychee
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-linux-x86_64 -o lychee
          chmod +x lychee
          sudo mv lychee /usr/local/bin/

      - name: Check Links in HTML & Markdown
        run: |
          lychee \
            --verbose \
            --no-progress \
            --exclude-path .git \
            --exclude-path node_modules \
            --exclude-path .github \
            --exclude 'https?://(localhost|127.0.0.1|0.0.0.0):.*' \
            --exclude 'https?://.*\.local' \
            --exclude 'mailto:.*' \
            --max-redirects 3 \
            --timeout 15 \
            --accept 200,301,302,401 \
            . || echo "⚠️ Link check completed with issues"

      - name: Generate Report
        if: always()
        run: |
          echo "### 🔗 Link Check Report" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Link validation completed" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Excluded paths:" >> $GITHUB_STEP_SUMMARY
          echo "- .git/" >> $GITHUB_STEP_SUMMARY
          echo "- node_modules/" >> $GITHUB_STEP_SUMMARY
          echo "- .github/" >> $GITHUB_STEP_SUMMARY
          echo "- localhost, 127.0.0.1, *.local domains" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical links broken
        if: failure()
        run: exit 1
